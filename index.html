<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Det er et 12-tal!</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="route_map.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

<!-- TOP MENU & LOGO -->
    <header class="site-header">
        <div class="header-container">
            
            <!-- Ny fælles kasse til logo og titel -->
            <div class="site-brand">
                <a href="index.html" class="site-logo">
                    <img src="logo.png" alt="EV Roadtrip Logo">
                </a>
                <h1 class="site-title">EV Route Planner</h1>
            </div>
            
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Forside</a></li>
                    <li><a href="how_to.html">How To</a></li>
                    <li><a href="about_us.html">Om Os</a></li>
                    <li><a href="contact.html">Kontakt</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- CENTRERET HOVEDINDHOLD -->
    <main class="page-content">
        
        <div class="app-container">
            
<!-- TOP PANEL: Formular -->
            <div class="panel form-panel">
                <div class="form-grid">
                    <!-- Række 1 (Venstre, Midt, Højre) -->
                    <div class="form-group">
                        <label>Start</label>
                        <input type="text" id="start" placeholder="Indtast startsted her...">
                    </div>
                    <div class="form-group">
                        <label>Rækkevidde (km)</label>
                        <input type="number" id="maxRange" value="400">
                    </div>
                    <div class="form-group">
                        <label>Tving antal stop <span class="hint">0 = auto</span></label>
                        <input type="number" id="manualStops" value="0" min="0" max="15">
                    </div>

                    <!-- Række 2 (Venstre, Midt, Højre) -->
                    <div class="form-group">
                        <label>Destination</label>
                        <input type="text" id="end" placeholder="Indtast destination her...">
                    </div>
                    <div class="form-group">
                        <label>Batteri (%)</label>
                        <input type="number" id="battery" value="50" min="1" max="100">
                    </div>
                    <div class="form-group">
                        <button onclick="findRoute()" id="calcBtn">Beregn</button>
                    </div>
                </div>

                <div id="result"></div>
            </div>

            <!-- BUND PANEL: Kort -->
            <div class="panel map-panel">
                <div id="map"></div>
            </div>

        </div>

    </main>
    <footer class="site-footer">
        <div class="footer-container">
            <p>&copy; 2026 EV Route Planner. Et AAU M6 IT-Ledelse eksamensprojekt.</p>
            <p>Udviklet for sjov (og for en god karakter) af Christian Strøm & Morten Nielsen.</p>
        </div>
    </footer>

    <!-- LEAFLET & DIT JAVASCRIPT -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([56.2639, 9.5018], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let currentRouteLine = null;
        let markers = [];

        const chargerIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/807/807262.png',
            iconSize: [28, 28],
            iconAnchor: [14, 28],
            popupAnchor: [0, -28]
        });

        function clearMap() {
            if (currentRouteLine) map.removeLayer(currentRouteLine);
            markers.forEach(m => map.removeLayer(m));
            markers = [];
        }

        function getDistance(coord1, coord2) {
            const R = 6371; 
            const dLat = (coord2[0] - coord1[0]) * Math.PI / 180;
            const dLon = (coord2[1] - coord1[1]) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(coord1[0] * Math.PI / 180) * Math.cos(coord2[0] * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        async function getCoordinates(address) {
            const safeQuery = encodeURIComponent(address);
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${safeQuery}`, {
                headers: { 'Accept-Language': 'da', 'User-Agent': 'EV-Roadtrip-Planlaegger/1.2' }
            });

            const data = await res.json();
            if (data.length === 0) throw new Error(`Kunne ikke finde adressen: ${address}`);
            return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
        }

        async function findRealCharger(lat, lng) {
            const apiKey = "7a127b86-5694-4b35-b9d4-82452b412515";
            
            let url = `https://api.openchargemap.io/v3/poi/?output=json&latitude=${lat}&longitude=${lng}&distance=15&maxresults=1&minpowerkw=50&key=${apiKey}`;
            
            try {
                let res = await fetch(url);
                let data = await res.json();
                
                if (!data || data.length === 0) {
                    url = `https://api.openchargemap.io/v3/poi/?output=json&latitude=${lat}&longitude=${lng}&distance=15&maxresults=1&key=${apiKey}`;
                    res = await fetch(url);
                    data = await res.json();
                }

                if (data && data.length > 0) {
                    const title = data[0].AddressInfo.Title || "Ukendt Lader";
                    const isFast = data[0].Connections && data[0].Connections.some(c => c.PowerKW >= 50);
                    
                    return {
                        lat: data[0].AddressInfo.Latitude,
                        lng: data[0].AddressInfo.Longitude,
                        title: title + (isFast ? " ⚡ (Hurtiglader)" : ""),
                        address: data[0].AddressInfo.AddressLine1 || "Ukendt adresse"
                    };
                }
            } catch(e) {
                console.error("API Fejl:", e);
            }
            
            return { lat: lat, lng: lng, title: "Ingen lader fundet i området", address: "Ca. placering på ruten" };
        }

        async function findRoute() {
            const btn = document.getElementById('calcBtn');
            const resultDiv = document.getElementById('result');
            btn.innerText = "Planlægger rute...";
            btn.disabled = true;
            clearMap();

            try {
                const startCity = document.getElementById('start').value;
                const endCity = document.getElementById('end').value;
                const maxRange = parseFloat(document.getElementById('maxRange').value);
                const initialBattery = parseFloat(document.getElementById('battery').value);
                const manualStops = parseInt(document.getElementById('manualStops').value) || 0;
                
                const startCoords = await getCoordinates(startCity);
                const endCoords = await getCoordinates(endCity);

                const routeRes = await fetch(`https://router.project-osrm.org/route/v1/driving/${startCoords[1]},${startCoords[0]};${endCoords[1]},${endCoords[0]}?geometries=geojson&overview=full`);
                const routeData = await routeRes.json();
                
                const routeCoords = routeData.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                const totalDistanceKm = routeData.routes[0].distance / 1000;

                currentRouteLine = L.polyline(routeCoords, {color: '#3b82f6', weight: 5, opacity: 0.7}).addTo(map);
                map.fitBounds(currentRouteLine.getBounds());

                markers.push(L.marker(startCoords).addTo(map).bindPopup("<b>Start:</b> " + startCity));
                markers.push(L.marker(endCoords).addTo(map).bindPopup("<b>Destination:</b> " + endCity));

                let stops = [];
                
                if (manualStops > 0) {
                    const legDistance = totalDistanceKm / (manualStops + 1);
                    let accumulatedDistThisLeg = 0;

                    for (let i = 1; i < routeCoords.length; i++) {
                        let dist = getDistance(routeCoords[i-1], routeCoords[i]);
                        accumulatedDistThisLeg += dist;

                        if (accumulatedDistThisLeg >= legDistance && stops.length < manualStops) {
                            let searchPoint = routeCoords[i];
                            let charger = await findRealCharger(searchPoint[0], searchPoint[1]);
                            
                            stops.push({...charger, isEmergency: false});
                            
                            markers.push(L.marker([charger.lat, charger.lng], {icon: chargerIcon})
                               .addTo(map)
                               .bindPopup(`<b>Tvunget Stop ${stops.length}: ${charger.title}</b><br>${charger.address}`));
                            
                            accumulatedDistThisLeg = 0; 
                        }
                    }

                } else {
                    let currentBattery = initialBattery;
                    let accumulatedDistThisLeg = 0;
                    let totalAccumulatedDist = 0;
                    const MIN_BATTERY = 20; 
                    const CHARGE_TARGET = 80;

                    if (currentBattery <= MIN_BATTERY) {
                        let charger = await findRealCharger(startCoords[0], startCoords[1]);
                        stops.push({...charger, isEmergency: true});
                        currentBattery = CHARGE_TARGET; 
                    }

                    for (let i = 1; i < routeCoords.length; i++) {
                        let dist = getDistance(routeCoords[i-1], routeCoords[i]);
                        accumulatedDistThisLeg += dist;
                        totalAccumulatedDist += dist;

                        let usableRange = maxRange * ((currentBattery - MIN_BATTERY) / 100);

                        if (accumulatedDistThisLeg >= usableRange) {
                            let searchPoint = routeCoords[i];
                            let charger = await findRealCharger(searchPoint[0], searchPoint[1]);

                            stops.push({...charger, isEmergency: false});
                            
                            markers.push(L.marker([charger.lat, charger.lng], {icon: chargerIcon})
                               .addTo(map)
                               .bindPopup(`<b>Stop ${stops.length}: ${charger.title}</b><br>${charger.address}`));
                            
                            currentBattery = CHARGE_TARGET; 
                            accumulatedDistThisLeg = 0; 
                        }
                    }
                }

                let htmlOutput = `<strong>Turen er planlagt!</strong><br>Total distance: ${totalDistanceKm.toFixed(1)} km.<br><hr>`;

                if (stops.length === 0) {
                    resultDiv.className = "success";
                    htmlOutput += `Du kan køre hele vejen uden at lade. God tur!`;
                } else {
                    resultDiv.className = "info";
                    htmlOutput += `Du har brug for <b>${stops.length} ladestop</b> undervejs:<br>`;
                    
                    stops.forEach((stop, index) => {
                        if (stop.isEmergency) {
                            htmlOutput += `<div class="stop-item" style="color:#dc2626;"><b>⚠ Akut stop ved start:</b> ${stop.title} (${stop.address})</div>`;
                        } else {
                            htmlOutput += `<div class="stop-item"><b>Stop ${index + (stops[0] && stops[0].isEmergency ? 0 : 1)}:</b> ${stop.title}<br><small>${stop.address}</small></div>`;
                        }
                    });
                }

                resultDiv.innerHTML = htmlOutput;
                resultDiv.style.display = "block";

            } catch (error) {
                resultDiv.className = "warning";
                resultDiv.innerHTML = `<strong>Fejl:</strong> ${error.message}`;
                resultDiv.style.display = "block";
            } finally {
                btn.innerText = "Beregn Roadtrip";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
